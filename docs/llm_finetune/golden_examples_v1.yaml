        note: |
          Matches the existing rule in llm/prompt.py: "Strength, sauna,
          stretching, plank... are not separate workouts unless explicit
          running drills are given." Currently silently produces zero
          workouts (skip); for the fine-tuning target it should be an
          explicit UNSUPPORTED, not silence, so evaluators can score it.
  - group_id: unsupported_power_target
    status: UNSUPPORTED
    source: new
    reason: Power (running power in watts) target requested — no power_low/power_high step fields exist
      in Schema v1 yet (see plan point 7, 'power targets, if supported').
    variants:
      - id: unsupported_power_v1
        style: conversational
        text: |
          5 км в темпе по мощности 280-300 ватт.
        note: |
          Deliberately included per your point 7 ("power targets, if
          supported") — today they are not. Keep this UNSUPPORTED until a
          `power_low/power_high` step pair is added to plan_schema.py; do not
          let the model silently coerce watts into hr_* or pace_*.
