# FitWeaver golden dataset — seed v1 (Schema v1, docs/llm_finetune/SCHEMA_V1.md)
#
# Purpose: starting corpus for the FunctionGemma 270M baseline + fine-tune
# experiment. NOT wired into the production Qwen pipeline.
#
# Structure per your plan's point 12/13:
#   - one `group_id` per distinct canonical workout
#   - `canonical` is exactly `status: VALID` + a `workouts:` list valid
#     against plan_schema.py (WorkoutPlanSchema)
#   - `variants` are natural-language paraphrases of the SAME canonical
#     workout — keep every variant of one group in the same train/val/test
#     split, never spread across splits (leakage rule, point 13)
#   - `status: NEEDS_CLARIFICATION` / `UNSUPPORTED` groups have no `canonical`
#     workouts; they carry the expected `question` / `reason` instead
#
# Provenance (62 groups total as of v3):
#   - groups 1-13 (v1): 8 VALID promoted from src/garmin_fit/llm/strict_examples.yaml
#     (existing few-shot corpus for the production prompt) with paraphrases
#     added, 1 hallucination-trap, 2 NEEDS_CLARIFICATION, 2 UNSUPPORTED.
#   - groups with source starting "promoted:fitweaver_golden_dataset.zip":
#     real confirmed-on-watch structures pulled from the marathon-cycle
#     planning chat ("Структура тренировочного плана на три забега") — see
#     docs/llm_finetune/REAL_DATASET_NOTES.md for the back_to_offset finding
#     from that chat and its current-code re-verification.
#   - groups with source "new": synthetic groups filling structural gaps
#     (nested repeat, standalone open_step/time_hr, pace-based variants of
#     HR-based patterns, more NEEDS_CLARIFICATION/UNSUPPORTED variety),
#     using the real marathon-cycle HR zones/paces (ВБ 120-135, АБ 125-142,
#     ДБ 135-145, ТБ 170-174, ИТ<ПАНО 165-172, ИТ МПК 175-182, МТ 150-162;
#     LT pace ~4:46/km) for domain-consistent numbers.
#   - groups with source "web_inspired": structure/terminology cross-checked
#     against public running-coaching sources (Yasso 800s, fartlek, relative-
#     pace long runs, run/walk intervals, circuit training) via web search;
#     wording is original, written for this dataset, not copied from any
#     single source. See README.md's 'web-search expansion' section for links.

