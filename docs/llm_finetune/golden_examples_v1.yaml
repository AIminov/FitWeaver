  # --- VALID: hallucination-trap cases (point 9) --------------------------

  - group_id: easy_hour_no_targets
    status: VALID
    source: new
    canonical:
      workouts:
        - filename: N1_Easy_1h
          name: N1_Easy_1h
          desc: "Easy hour, no explicit HR or pace target"
          type_code: easy
          distance_km: null
          estimated_duration_min: 60
          steps:
            - type: time_step
              seconds: 3600
              intensity: recovery
    variants:
      - id: easy_hour_no_targets_v1
        style: conversational
        text: |
          Беги час легко.
        note: |
          Hallucination trap: the model must NOT invent hr_low/hr_high or a
          pace target. Only duration=3600, intensity=recovery are licensed
          by the text. Adding "hr_low: 120, hr_high: 145" here is a failure,
          not a helpful guess.

  # --- NEEDS_CLARIFICATION (point 10) --------------------------------------

  - group_id: ambiguous_430_duration_or_pace
    status: NEEDS_CLARIFICATION
    source: new
    question: "4:30 — продолжительность интервала или темп 4:30/км?"
    variants:
      - id: ambiguous_430_v1
        style: conversational
        text: |
          5 интервалов по 4:30
        note: |
          Textbook case from the plan doc itself. "4:30" could be a duration
          (mm:ss) or a pace (min/km) — nothing in the sentence disambiguates.
          Do not guess either interpretation.

  - group_id: ambiguous_effort_by_feel
    status: NEEDS_CLARIFICATION
    source: new
    question: "Нужен ли числовой ориентир (пульс или темп), или тренировка полностью по самочувствию без конкретных цифр?"
    variants:
      - id: ambiguous_effort_v1
        style: conversational
        text: |
          Побегай минут 40-50 в своё удовольствие, темп по самочувствию.
        note: |
          Already flagged by plan_processing.detect_source_ambiguities() via
          the "по самочувствию" pattern today, but only as a free-text repair
          note, not a blocking status — this is the case that motivates §3
          of SCHEMA_V1.md.

  # --- UNSUPPORTED (point 10) ----------------------------------------------

  - group_id: unsupported_strength_session
    status: UNSUPPORTED
    source: new
    reason: "Strength/gym session, not a running workout — no FitWeaver step type applies."
    variants:
      - id: unsupported_strength_v1
        style: conversational
        text: |
          Сегодня зал: присед 4х8, жим лёжа 4х8, планка 3х1мин.
        note: |
          Matches the existing rule in llm/prompt.py: "Strength, sauna,
          stretching, plank... are not separate workouts unless explicit
          running drills are given." Currently silently produces zero
          workouts (skip); for the fine-tuning target it should be an
          explicit UNSUPPORTED, not silence, so evaluators can score it.

  - group_id: unsupported_power_target
    status: UNSUPPORTED
    source: new
    reason: "Power (running power in watts) target requested — no power_low/power_high step fields exist in Schema v1 yet (see plan point 7, 'power targets, if supported')."
    variants:
      - id: unsupported_power_v1
        style: conversational
        text: |
          5 км в темпе по мощности 280-300 ватт.
        note: |
          Deliberately included per your point 7 ("power targets, if
          supported") — today they are not. Keep this UNSUPPORTED until a
          `power_low/power_high` step pair is added to plan_schema.py; do not
          let the model silently coerce watts into hr_* or pace_*.
