# FitWeaver golden dataset — seed v1 (Schema v1, docs/llm_finetune/SCHEMA_V1.md)
#
# Purpose: starting corpus for the FunctionGemma 270M baseline + fine-tune
# experiment. NOT wired into the production Qwen pipeline.
#
# Structure per your plan's point 12/13:
#   - one `group_id` per distinct canonical workout
#   - `canonical` is exactly `status: VALID` + a `workouts:` list valid
#     against plan_schema.py (WorkoutPlanSchema)
#   - `variants` are natural-language paraphrases of the SAME canonical
#     workout — keep every variant of one group in the same train/val/test
#     split, never spread across splits (leakage rule, point 13)
#   - `status: NEEDS_CLARIFICATION` / `UNSUPPORTED` groups have no `canonical`
#     workouts; they carry the expected `question` / `reason` instead
#
# Provenance: VALID groups 1-8 promoted from the existing few-shot corpus at
# src/garmin_fit/llm/strict_examples.yaml (already Russian-input -> YAML-output
# pairs used by the production prompt) — reused rather than reinvented, with
# 1-2 additional paraphrases added per group, including short coach-shorthand
# style per your point 11 ("2р + СБУ + 5х1000 4.35-4.40 отд 2' + 2з").
# Groups 9+ are new, added specifically to cover clarification/unsupported/
# hallucination-trap cases your plan calls out as under-represented.

groups:

  # --- VALID: promoted from strict_examples.yaml, paraphrases added -------

  - group_id: intervals_pace_800
    status: VALID
    source: promoted:intervals_pace
    canonical:
      workouts:
        - filename: W16_04-14_Tue_Intervals_6x800m
          name: W16_04-14_Tue_Intervals_6x800m
          desc: "Classic intervals: 6x800m at tempo pace with jogging recovery"
          type_code: intervals
          distance_km: 10.2
          estimated_duration_min: 55
          steps:
            - type: dist_pace
              km: 2.0
              pace_fast: "5:45"
              pace_slow: "6:00"
              intensity: warmup
            - type: dist_pace
              km: 0.8
              pace_fast: "4:20"
              pace_slow: "4:30"
              intensity: active
            - type: dist_pace
              km: 0.4
              pace_fast: "5:30"
              pace_slow: "6:00"
              intensity: recovery
            - type: repeat
              back_to_offset: 1
              count: 6
            - type: dist_pace
              km: 1.0
              pace_fast: "5:45"
              pace_slow: "6:00"
              intensity: cooldown
    variants:
      - id: intervals_pace_800_v1_formal
        style: formal_plan
        text: |
          14.04.2026 (вт)
          Интервалы 6x800м
          Разминка: 2 км (5:45-6:00)
          6x800м по 4:20-4:30, восстановление 400 м трусцой (5:30-6:00)
          Заминка: 1 км (5:45-6:00)
          Итого: ~10.2 км, 55 мин
      - id: intervals_pace_800_v2_shorthand
        style: coach_shorthand
        text: |
          14.04 вт: р2(5.45-6.00) + 6х800 4.20-4.30 отд 400 трусцой(5.30-6.00) + з1(5.45-6.00)
      - id: intervals_pace_800_v3_conversational
        style: conversational
        text: |
          Во вторник интервальная: сначала два километра разминки в темпе 5:45-6:00,
          потом шесть восьмисоток по 4:20-4:30, между ними по 400 метров трусцой
          в темпе 5:30-6:00, и километр заминки в том же лёгком темпе.

